[build]
command = "npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Redirect all non-file routes to Next.js for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
condition = "!{force}"

# Don't apply redirect to actual files
[[redirects]]
from = "/_next/*"
to = "/_next/:splat"
status = 200

